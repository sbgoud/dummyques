function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

let timerInterval;

function generate() {
  const count = parseInt(document.getElementById("count").value);
  if (!count || count <= 0) {
    alert("Enter a valid number");
    return;
  }

  const status = document.getElementById("status");
  const start = performance.now();
  status.innerHTML = `<div class="spinner"></div> Processing… 0.00s`;

  timerInterval = setInterval(() => {
    const elapsed = ((performance.now() - start) / 1000).toFixed(2);
    status.innerHTML = `<div class="spinner"></div> Processing… ${elapsed}s`;
  }, 50);

  setTimeout(() => {
    const data = [];
    for (let i = 1; i <= count; i++) {
      const subject = subjects[rand(0, subjects.length - 1)];
      data.push({
        subject_id: subject.id,
        subject_name: subject.name,
        question_text: `Dummy question ${i}: What is the correct answer?`,
        options: JSON.stringify({
          A: "Dummy Option A",
          B: "Dummy Option B",
          C: "Dummy Option C",
          D: "Dummy Option D"
        }),
        correct_answer: ["A","B","C","D"][rand(0,3)],
        difficulty: rand(35,95),
        is_published: i <= count / 2 ? 0 : rand(1990,2025),
        explanation: `This is a dummy explanation for question ${i}.`
      });
    }

    clearInterval(timerInterval);
    const total = ((performance.now() - start) / 1000).toFixed(2);
    status.textContent = `Finished in ${total} seconds — thank you, copy now`;
    document.getElementById("output").value = JSON.stringify(data, null, 2);
  }, 10);
}

function copyJSON() {
  const t = document.getElementById("output");
  t.select();
  document.execCommand("copy");
  alert("JSON copied to clipboard!");
}
